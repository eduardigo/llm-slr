theme: games
status: validated
language: en
topic: >
  Software engineering research in the domain of computer games.
research_question: >
  What software engineering research topics, approaches, and methods are
  being addressed in the domain of computer games?
inclusion_criteria:
  - The study is relevant to software engineering, i.e., it can be classified
    under a software engineering topic applied to computer or video games.
  - The study addresses requirements/analysis, design (including software
    architecture, game engines, and design patterns), implementation, quality
    (including testing, usability, and playability evaluation), or project
    management in the context of game development.
  - The study reports generic software engineering research for games, such
    as development processes, methodologies, practices, or empirical accounts
    of game development projects.
