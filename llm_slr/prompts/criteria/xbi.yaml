theme: xbi
status: draft
language: en
topic: >
  Automatic detection of cross-browser incompatibilities (XBIs) in web
  applications.
research_question: >
  Which technological approaches, techniques, and tools are used or proposed
  to automatically detect cross-browser incompatibilities in web
  applications?
inclusion_criteria:
  - The study reports a technological approach for automatically detecting
    cross-browser incompatibilities, inconsistencies, or compatibility issues
    of web applications across different browsers, browser versions, or
    configurations.
  - The study proposes or evaluates cross-browser compatibility testing
    techniques (e.g., DOM model analysis, visual/screenshot comparison,
    crawling and differencing, machine learning over rendering features).
  - The study presents tools for cross-browser or cross-platform testing of
    web applications, including mobile browsers, or their empirical
    validation.
